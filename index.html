<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Post-its Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      color: #333;
      font-size: 1.5rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    button.btn-export {
      background-color: #28a745;
    }
    button.btn-export:hover {
      background-color: #218838;
    }

    button.btn-import {
      background-color: #17a2b8;
    }
    button.btn-import:hover {
      background-color: #138496;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .postit {
      padding: 18px;
      border-radius: 8px;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
      min-height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .postit:hover {
      transform: translateY(-3px);
    }

    .postit-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: #222;
      word-break: break-word;
      z-index: 2;
    }

    .postit-content {
      color: #444;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      flex-grow: 1;
      z-index: 2;
    }

    .postit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
      z-index: 2;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.75);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: #333;
      font-size: 0.8rem;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.95);
    }

    /* Cores e Estampas dos Post-its */
    .color-yellow { background-color: #fff59d; }
    .color-pink   { background-color: #ffab91; }
    .color-green  { background-color: #a5d6a7; }
    .color-blue   { background-color: #81d4fa; }
    .color-purple { background-color: #e1bee7; }

    .color-striped-orange-green {
      background: repeating-linear-gradient(
        45deg,
        #ffab91,
        #ffab91 3.75px,
        #a5d6a7 3.75px,
        #a5d6a7 7.5px
      );
    }

    .color-rainbow-blue {
      background: linear-gradient(180deg, #b3e5fc 0%, #81d4fa 100%);
      position: relative;
    }
    .color-rainbow-blue::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 90px;
      background: radial-gradient(ellipse at bottom, transparent 40%, rgba(255,118,117,0.4) 42%, rgba(250,177,160,0.4) 48%, rgba(255,234,167,0.4) 54%, rgba(85,239,196,0.4) 60%, rgba(116,185,255,0.4) 66%, rgba(162,155,254,0.4) 72%, transparent 74%);
      pointer-events: none;
    }

    .color-sheep-sky {
      background-color: #e3f2fd;
      background-image: 
        radial-gradient(circle 14px at 15% 20%, #ffffff 100%, transparent 0%),
        radial-gradient(circle 9px at 23% 18%, #ffffff 100%, transparent 0%),
        radial-gradient(circle 10px at 10% 18%, #ffffff 100%, transparent 0%),
        radial-gradient(circle 16px at 80% 70%, #ffffff 100%, transparent 0%),
        radial-gradient(circle 10px at 88% 68%, #ffffff 100%, transparent 0%),
        radial-gradient(circle 11px at 72% 68%, #ffffff 100%, transparent 0%);
      position: relative;
    }
    .color-sheep-sky::after {
      content: "🐑 ☁️     🐑 ☁️";
      position: absolute;
      top: 10px; left: 10px; right: 10px;
      font-size: 0.9rem;
      pointer-events: none;
      display: flex;
      justify-content: space-around;
      opacity: 0.9;
    }

    .color-daisies-purple {
      background-color: #f3e5f5;
      padding: 24px;
    }
    .color-daisies-purple::before, .color-daisies-purple::after {
      content: "🌼 🌼 🌼 🌼 🌼 🌼 🌼 🌼 🌼";
      position: absolute;
      left: 4px; right: 4px;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
    }
    .color-daisies-purple::before { top: 4px; }
    .color-daisies-purple::after { bottom: 4px; }

    .color-pastel-roses {
      background-color: #fffde7;
      padding: 24px;
    }
    .color-pastel-roses::before, .color-pastel-roses::after {
      content: "🌹 🌷 🌹 🌷 🌹 🌷 🌹 🌷 🌹";
      position: absolute;
      left: 4px; right: 4px;
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-align: center;
      pointer-events: none;
    }
    .color-pastel-roses::before { top: 4px; }
    .color-pastel-roses::after { bottom: 4px; }

    .color-lilac-yellow-dots {
      background-color: #e1bee7;
      background-image: 
        radial-gradient(circle, #ffee58 2.5px, transparent 2.5px),
        radial-gradient(circle, #ffee58 2.5px, transparent 2.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-content h2 {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .color-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .color-option {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      transition: transform 0.15s, border-color 0.15s;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .color-option:hover {
      transform: scale(1.1);
    }

    .color-option.selected {
      border-color: #222;
      transform: scale(1.15);
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    }

    .color-option.color-striped-orange-green {
      background: repeating-linear-gradient(
        45deg,
        #ffab91,
        #ffab91 3.75px,
        #a5d6a7 3.75px,
        #a5d6a7 7.5px
      );
    }

    .color-option.color-rainbow-blue {
      background-color: #81d4fa;
      background-image: radial-gradient(circle at 50% 120%, transparent 42%, #ff7675 45%, #fab1a0 50%, #ffeaa7 55%, #55efc4 60%, #74b9ff 65%, #a29bfe 70%, transparent 73%);
    }

    .color-option.color-lilac-yellow-dots {
      background-color: #e1bee7;
      background-image: 
        radial-gradient(circle, #ffee58 1.5px, transparent 1.5px),
        radial-gradient(circle, #ffee58 1.5px, transparent 1.5px);
      background-size: 12px 12px;
      background-position: 0 0, 6px 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>📌 Meus Post-its</h1>
    <div class="btn-group">
      <button onclick="openModal()">+ Nova Nota</button>
      <button class="btn-export" onclick="exportData()">💾 Backup</button>
      <button class="btn-import" onclick="document.getElementById('importFile').click()">📂 Restaurar</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
    </div>
  </header>

  <div class="notes-grid" id="notesGrid"></div>

  <!-- Modal -->
  <div class="modal" id="noteModal">
    <div class="modal-content">
      <h2 id="modalTitle">Novo Post-it</h2>
      <input type="hidden" id="noteId">
      
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="noteTitleInput" placeholder="Ex: Compras da semana">
      </div>

      <div class="form-group">
        <label>Conteúdo</label>
        <textarea id="noteContentInput" rows="3" placeholder="Escreva aqui sua anotação..."></textarea>
      </div>

      <div class="form-group">
        <label>Cor ou Estampa do Post-it</label>
        <div class="color-picker" id="colorPicker">
          <div class="color-option color-yellow selected" data-color="yellow" onclick="selectColor('yellow')" title="Amarelo"></div>
          <div class="color-option color-pink" data-color="pink" onclick="selectColor('pink')" title="Rosa"></div>
          <div class="color-option color-green" data-color="green" onclick="selectColor('green')" title="Verde"></div>
          <div class="color-option color-blue" data-color="blue" onclick="selectColor('blue')" title="Azul"></div>
          <div class="color-option color-purple" data-color="purple" onclick="selectColor('purple')" title="Roxo"></div>
          
          <div class="color-option color-striped-orange-green" data-color="striped-orange-green" onclick="selectColor('striped-orange-green')" title="Listrado Laranja e Verde"></div>
          <div class="color-option color-rainbow-blue" data-color="rainbow-blue" onclick="selectColor('rainbow-blue')" title="Azul com Arco-íris"></div>
          <div class="color-option color-sheep-sky" data-color="sheep-sky" onclick="selectColor('sheep-sky')" title="Céu com Carneirinhos">🐑</div>
          <div class="color-option color-daisies-purple" data-color="daisies-purple" onclick="selectColor('daisies-purple')" title="Margaridas no Lilás">🌼</div>
          <div class="color-option color-pastel-roses" data-color="pastel-roses" onclick="selectColor('pastel-roses')" title="Rosas no Amarelo Pastel">🌹</div>
          <div class="color-option color-lilac-yellow-dots" data-color="lilac-yellow-dots" onclick="selectColor('lilac-yellow-dots')" title="Lilás com Bolinhas Amarelas"></div>
        </div>
      </div>

      <div class="btn-group" style="justify-content: flex-end; margin-top: 15px;">
        <button style="background: #6c757d;" onclick="closeModal()">Cancelar</button>
        <button onclick="saveNote()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    let db;
    let selectedColor = 'yellow';

    const dbRequest = indexedDB.open("PostItDB", 1);

    dbRequest.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("notes")) {
        db.createObjectStore("notes", { keyPath: "id", autoIncrement: true });
      }
    };

    dbRequest.onsuccess = function(e) {
      db = e.target.result;
      renderNotes();
    };

    dbRequest.onerror = function(e) {
      console.error("Erro ao abrir banco de dados local:", e);
    };

    function renderNotes() {
      const grid = document.getElementById("notesGrid");
      grid.innerHTML = "";

      if (!db) return;
      const transaction = db.transaction(["notes"], "readonly");
      const store = transaction.objectStore("notes");
      const request = store.getAll();

      request.onsuccess = function() {
        const notes = request.result;
        if (notes.length === 0) {
          grid.innerHTML = "<p style='color: #777; grid-column: 1/-1; text-align: center;'>Nenhum Post-it cadastrado. Clique em '+ Nova Nota' para criar!</p>";
          return;
        }

        notes.reverse().forEach(note => {
          const card = document.createElement("div");
          card.className = `postit color-${note.color || 'yellow'}`;
          card.innerHTML = `
            <div>
              <div class="postit-title">${escapeHtml(note.title)}</div>
              <div class="postit-content">${escapeHtml(note.content)}</div>
            </div>
            <div class="postit-actions">
              <button class="btn-action" onclick="editNote(${note.id})">✏️ Editar</button>
              <button class="btn-action" onclick="deleteNote(${note.id})">🗑️ Excluir</button>
            </div>
          `;
          grid.appendChild(card);
        });
      };
    }

    function saveNote() {
      const id = document.getElementById("noteId").value;
      const title = document.getElementById("noteTitleInput").value.trim();
      const content = document.getElementById("noteContentInput").value.trim();

      if (!title) {
        alert("Por favor, informe um título!");
        return;
      }

      const noteData = { title, content, color: selectedColor, date: new Date().toISOString() };
      
      const transaction = db.transaction(["notes"], "readwrite");
      const store = transaction.objectStore("notes");

      if (id) {
        noteData.id = parseInt(id);
        store.put(noteData);
      } else {
        store.add(noteData);
      }

      transaction.oncomplete = function() {
        closeModal();
        renderNotes();
      };
    }

    window.editNote = function(id) {
      const transaction = db.transaction(["notes"], "readonly");
      const store = transaction.objectStore("notes");
      const request = store.get(id);

      request.onsuccess = function() {
        const note = request.result;
        if (note) {
          document.getElementById("noteId").value = note.id;
          document.getElementById("noteTitleInput").value = note.title;
          document.getElementById("noteContentInput").value = note.content;
          selectColor(note.color || 'yellow');
          document.getElementById("modalTitle").innerText = "Editar Post-it";
          document.getElementById("noteModal").style.display = "flex";
        }
      };
    };

    window.deleteNote = function(id) {
      if (confirm("Deseja realmente excluir esta nota?")) {
        const transaction = db.transaction(["notes"], "readwrite");
        const store = transaction.objectStore("notes");
        store.delete(id);
        transaction.oncomplete = function() {
          renderNotes();
        };
      }
    };

    window.openModal = function() {
      document.getElementById("noteId").value = "";
      document.getElementById("noteTitleInput").value = "";
      document.getElementById("noteContentInput").value = "";
      selectColor('yellow');
      document.getElementById("modalTitle").innerText = "Novo Post-it";
      document.getElementById("noteModal").style.display = "flex";
    };

    window.closeModal = function() {
      document.getElementById("noteModal").style.display = "none";
    };

    window.selectColor = function(color) {
      selectedColor = color;
      document.querySelectorAll('.color-option').forEach(el => {
        el.classList.toggle('selected', el.dataset.color === color);
      });
    };

    window.exportData = function() {
      const transaction = db.transaction(["notes"], "readonly");
      const store = transaction.objectStore("notes");
      const request = store.getAll();

      request.onsuccess = function() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(request.result, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `postit_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };
    };

    window.importData = function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedNotes = JSON.parse(e.target.result);
          if (Array.isArray(importedNotes)) {
            const transaction = db.transaction(["notes"], "readwrite");
            const store = transaction.objectStore("notes");

            store.clear().onsuccess = function() {
              importedNotes.forEach(note => {
                delete note.id;
                store.add(note);
              });
            };

            transaction.oncomplete = function() {
              alert("Backup restaurado com sucesso!");
              renderNotes();
            };
          } else {
            alert("Arquivo de backup inválido.");
          }
        } catch (err) {
          alert("Erro ao ler o arquivo de backup.");
        }
      };
      reader.readAsText(file);
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
