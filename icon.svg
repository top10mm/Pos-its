<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4E6"/>
      <stop offset="1" stop-color="#F6E9FB"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB877"/>
      <stop offset="1" stop-color="#FF9A4D"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9B8F0"/>
      <stop offset="1" stop-color="#BE8FE0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#6A3F8F" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- folha lilás (atrás) -->
  <g transform="rotate(11 300 230)" filter="url(#sh)">
    <rect x="175" y="100" width="215" height="215" rx="22" fill="url(#lilac)"/>
    <rect x="175" y="100" width="215" height="44" rx="22" fill="#fff" opacity="0.18"/>
    <rect x="175" y="122" width="215" height="22" fill="#fff" opacity="0.18"/>
  </g>

  <!-- folha laranja (na frente) -->
  <g transform="rotate(-6 250 300)" filter="url(#sh)">
    <path d="M142 168 H358 a24 24 0 0 1 24 24 V338 L318 402 H142 a24 24 0 0 1 -24 -24 V192 a24 24 0 0 1 24 -24 Z" fill="url(#orange)"/>
    <!-- dobrinha -->
    <path d="M382 338 L318 402 V362 a24 24 0 0 1 24 -24 Z" fill="#E67E2E"/>
    <path d="M382 338 L318 402 V362 a24 24 0 0 1 24 -24 Z" fill="#fff" opacity="0.18"/>
    <!-- brilho topo -->
    <path d="M142 168 H358 a24 24 0 0 1 24 24 V212 H118 V192 a24 24 0 0 1 24 -24 Z" fill="#fff" opacity="0.2"/>
    <!-- carinha -->
    <ellipse cx="205" cy="283" rx="15" ry="18" fill="#4A2A1A"/>
    <ellipse cx="295" cy="283" rx="15" ry="18" fill="#4A2A1A"/>
    <circle cx="210" cy="276" r="5.5" fill="#fff"/>
    <circle cx="300" cy="276" r="5.5" fill="#fff"/>
    <ellipse cx="177" cy="313" rx="19" ry="12" fill="#FF6F7D" opacity="0.55"/>
    <ellipse cx="323" cy="313" rx="19" ry="12" fill="#FF6F7D" opacity="0.55"/>
    <path d="M232 308 Q250 330 268 308" fill="none" stroke="#4A2A1A" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
